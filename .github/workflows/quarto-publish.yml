# .github/workflows/quarto-pages-only.yml

name: Quarto Pages Only # Your chosen workflow name

on:
  push:
    branches:
      - main # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install system dependencies for Mermaid
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Configure environment for rendering
        run: |
          echo "DENO_V8_FLAGS=--max-old-space-size=8192" >> $GITHUB_ENV
          echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> $GITHUB_ENV

      - name: Render Quarto website
        timeout-minutes: 10
        run: quarto render

      - name: Upload site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ # <--- CRITICAL FIX: Ensure this path is 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
